services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-whauto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whauto}
      POSTGRES_DB: ${POSTGRES_DB:-whauto_dev}
    ports:
      - "5433:5432"
    volumes:
      - whauto_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whauto} -d ${POSTGRES_DB:-whauto_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - whauto_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  whauto_postgres_data:
  whauto_redis_data:
